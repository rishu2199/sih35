    accuracy_class: "CLASS_I"
    designation: "Special Accuracy"
    table_3_tiers:
      - tier_id: "CLASS_I_TIER_1"
        tier_name: "Special Accuracy: e >= 1 mg"
        e_min_g: "0.001"
        e_max_g: null
        n_min: "50000"
        n_max: null
        min_factor_e: "100"
    mpe_brackets_initial:
      - bracket_index: 1
        bracket_name: "0 <= m <= 50,000"
        m_min: "0"
        m_max: "50000"
        base_mpe_factor: "0.5"
      - bracket_index: 2
        bracket_name: "50,000 < m <= 200,000"
        m_min: "50000"
        m_max: "200000"
        base_mpe_factor: "1.0"
      - bracket_index: 3
        bracket_name: "200,000 < m"
        m_min: "200000"
        m_max: null
        base_mpe_factor: "1.5"
    in_service_multiplier: "2.0"
    repeatability_runs: 10
    repeatability_mpe_fraction: "1.0"
    discrimination_factor_d: "1.4"
    eccentricity_load_fraction: "0.333333333333"

