  base_standard_weights_fraction: "0.5"
  tier1_repeatability_threshold_e: "0.3"
  tier1_standard_weights_fraction: "0.333333333333"
  tier2_repeatability_threshold_e: "0.2"
  tier2_standard_weights_fraction: "0.2"
  statutory_reference: "OIML R 76-1:2006 Clause 3.7.3 & Fourth Amendment Rules 2026"
