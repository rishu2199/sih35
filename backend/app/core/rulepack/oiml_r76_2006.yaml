meta:
  rulepack_id: "OIML_R76_2006"
  name: "OIML R 76-1:2006 (Non-Automatic Weighing Instruments)"
  version: "2006.1"
  effective_date: "2006-10-01"
  is_draft: false
  description: "International Recommendation for Non-Automatic Weighing Instruments, Edition 2006 (E)."
  jurisdiction: "INTERNATIONAL"
  statutory_references:
    - "OIML R 76-1:2006"
    - "Legal Metrology (General) Rules, 2011, Seventh Schedule"

classes:
