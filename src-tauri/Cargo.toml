[package]
name = "metrologix-76"
version = "1.0.0"
description = "METROLOGIX-76: Autonomous Verification Engine for Non-Automatic Weighing Instruments (NAWI) under OIML R 76-1:2006 and Legal Metrology Act, 2009"
authors = ["Department of Consumer Affairs (DoCA)", "Regional Reference Standard Laboratories (RRSL)"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["shell-open", "fs-all", "dialog-all", "path-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
